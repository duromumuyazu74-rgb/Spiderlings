version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      npm-maintenance:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /KinkyDungeon-Spiderlings/tools
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      atlas-maintenance:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      actions-maintenance:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    target-branch: test
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      npm-maintenance:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /KinkyDungeon-Spiderlings/tools
    target-branch: test
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      atlas-maintenance:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: test
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      actions-maintenance:
        patterns: ["*"]
