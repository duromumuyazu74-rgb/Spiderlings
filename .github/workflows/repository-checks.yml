name: Repository checks

on:
  workflow_dispatch:
  pull_request:
    branches: [main, test]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, test]

permissions:
  contents: read

jobs:
  windows-worktree-safety:
    name: Windows worktree safety
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node --test KinkyDungeon-Spiderlings/tools/tests/spiderlings-worktree-safety.test.js
  delivery:
    name: Delivery checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: KinkyDungeon-Spiderlings/tools/requirements-atlas.txt
      - run: npm ci
      - run: python -m pip install --requirement KinkyDungeon-Spiderlings/tools/requirements-atlas.txt
      - name: Verify delivery and record evidence
        if: ${{ !cancelled() }}
        run: npm run report:delivery -- --mode public --build
        env:
          BASE_SHA: ${{ github.event.before || github.sha }}
      - name: Retain delivery evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spiderlings-evidence-${{ github.sha }}
          path: .scratch/delivery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spiderlings-${{ github.sha }}
          path: Spiderlings_*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  repository:
    name: Repository checks
    needs: [windows-worktree-safety, delivery]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node .github/scripts/check-workflow-needs.mjs
        env:
          REQUIRED_JOB_RESULTS: ${{ toJSON(needs) }}
