name: Repository checks

on:
  pull_request:
    branches: [main, test]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, test]

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: KinkyDungeon-Spiderlings/tools/requirements-atlas.txt
      - run: npm ci
      - run: python -m pip install --requirement KinkyDungeon-Spiderlings/tools/requirements-atlas.txt
      - run: npm run check
        env:
          BASE_SHA: ${{ github.event.before || github.sha }}
      - run: npm test
      - run: npm run test:public
      - name: Build and verify installable package
        shell: pwsh
        run: |
          ./KinkyDungeon-Spiderlings/tools/build-spiderlings-release.ps1
          ./KinkyDungeon-Spiderlings/tools/build-spiderlings-release.ps1 -VerifyOnly
      - name: Check generated atlas
        run: git diff --exit-code -- KinkyDungeon-Spiderlings/TextureAtlas
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spiderlings-${{ github.sha }}
          path: Spiderlings_*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
