name: Repository checks

on:
  pull_request:
    branches: [main, test]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, test]

permissions:
  contents: read

jobs:
  windows-worktree-safety:
    name: Windows worktree safety
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
      - run: node --test Spiderlings_0.91/tools/tests/spiderlings-worktree-safety.test.js
  repository:
    name: Repository checks
    needs: windows-worktree-safety
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Spiderlings_0.91/tools/requirements-atlas.txt
      - run: npm ci
      - run: python -m pip install --requirement Spiderlings_0.91/tools/requirements-atlas.txt
      - name: Verify delivery and record evidence
        if: ${{ !cancelled() }}
        run: npm run report:delivery -- --mode public --build
        env:
          BASE_SHA: ${{ github.event.before }}
      - name: Retain delivery evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spiderlings-evidence-${{ github.sha }}
          path: .scratch/delivery/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spiderlings-${{ github.sha }}
          path: Spiderlings_*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
